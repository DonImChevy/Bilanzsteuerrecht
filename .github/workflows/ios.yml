name: iOS Build & Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web-tests:
    name: Web-App testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/tests/kern.test.mjs

  core-tests:
    name: Kernlogik testen (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version
        run: swift --version
      - name: Tests
        run: swift test

  app-build:
    name: App bauen (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project BSRTrainer.xcodeproj \
            -scheme BSRTrainer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
